# Обратный прокси KMHTO: https://kmhto.ru/ + wss://kmhto.ru/ws -> 127.0.0.1:8787
# Сертификаты удобно получить certbot'ом: certbot --nginx -d kmhto.ru -d www.kmhto.ru
server {
    listen 80;
    server_name kmhto.ru www.kmhto.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kmhto.ru www.kmhto.ru;

    # ssl_certificate     /etc/letsencrypt/live/kmhto.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kmhto.ru/privkey.pem;

    client_max_body_size 32m;   # загрузка xlsx

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # долгие соединения не рвать
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
